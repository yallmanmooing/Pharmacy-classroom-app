<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Classroom & Workspace</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #fff; height: 100vh; overflow: hidden; }

        /* Lobby */
        #lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 12px; background: #1e1e2e; }
        #lobby h1 { font-size: 26px; margin-bottom: 10px; color: #00adb5; }
        #lobby input, #lobby select { width: 280px; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2d2d44; color: white; font-size: 15px; outline: none; }
        #lobby button { width: 280px; padding: 12px; border-radius: 6px; border: none; background: #00adb5; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        #lobby button:hover { background: #00888e; }

        /* Main Workspace Layout */
        #app { display: none; height: 100vh; flex-direction: column; }
        #top-bar { height: 48px; background: #181824; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #2a2a3d; font-size: 14px; }
        #main-stage { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* Sidebar Tools & Participants */
        #sidebar { width: 260px; background: #1e1e2e; border-right: 1px solid #2a2a3d; display: flex; flex-direction: column; padding: 12px; gap: 12px; overflow-y: auto; }
        .section-title { font-size: 11px; font-weight: bold; color: #00adb5; text-transform: uppercase; letter-spacing: 0.5px; }
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .tool-btn { padding: 8px; background: #2d2d44; border: 1px solid #3d3d5c; color: white; border-radius: 4px; font-size: 12px; cursor: pointer; text-align: center; }
        .tool-btn.active { background: #00adb5; border-color: #00adb5; }
        .tool-btn.full { grid-column: span 2; }

        #participant-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        #participant-list li { background: #2d2d44; padding: 8px; border-radius: 4px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
        .user-meta { display: flex; justify-content: space-between; align-items: center; }
        .role-tag { font-size: 10px; padding: 2px 5px; border-radius: 3px; font-weight: bold; }
        .role-teacher { background: #e94560; color: white; }
        .role-student { background: #17a2b8; color: white; }
        .user-status { font-size: 10px; color: #aaa; display: flex; gap: 8px; }

        /* Canvas Stage */
        #canvas-container { flex: 1; position: relative; background: #ffffff; display: flex; align-items: center; justify-content: center; }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

        /* Video Streams Grid */
        #video-grid { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 8px; z-index: 5; max-width: 60%; overflow-x: auto; }
        video { width: 130px; height: 95px; background: #000; border-radius: 6px; object-fit: cover; border: 2px solid #2a2a3d; }

        /* Chat Overlay Drawer */
        #chat-drawer { position: absolute; right: 0; top: 0; bottom: 0; width: 300px; background: #181824; border-left: 1px solid #2a2a3d; display: none; flex-direction: column; z-index: 10; }
        #chat-header { padding: 12px; background: #1e1e2e; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; border-bottom: 1px solid #2a2a3d; }
        #chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .msg { background: #2d2d44; padding: 8px 10px; border-radius: 6px; }
        .msg-sender { font-size: 11px; font-weight: bold; color: #00adb5; margin-bottom: 2px; }
        #chat-input-area { padding: 10px; background: #1e1e2e; display: flex; gap: 6px; border-top: 1px solid #2a2a3d; }
        #chat-input { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #2d2d44; color: white; font-size: 13px; outline: none; }
        #chat-disabled-msg { display: none; padding: 10px; background: #d9534f; text-align: center; font-size: 12px; font-weight: bold; }

        /* Bottom Controls Bar */
        #controls-bar { height: 56px; background: #181824; display: flex; align-items: center; justify-content: center; gap: 12px; border-top: 1px solid #2a2a3d; }
        .ctrl-btn { padding: 8px 16px; border-radius: 20px; border: none; background: #2d2d44; color: white; cursor: pointer; font-size: 13px; font-weight: bold; }
        .ctrl-btn.active { background: #28a745; }
        .ctrl-btn.danger { background: #dc3545; }
    </style>
</head>
<body>

<div id="lobby">
    <h1>Pharmacy Interactive Board</h1>
    <input type="text" id="username" placeholder="Your Display Name">
    <input type="text" id="room-code" placeholder="Room Code (e.g., PHARM101)">
    <select id="user-role">
        <option value="student">Student</option>
        <option value="host">Teacher (Host)</option>
    </select>
    <button onclick="joinRoom()">Join Classroom</button>
</div>

<div id="app">
    <div id="top-bar">
        <span>Room: <strong id="disp-room" style="color:#00adb5;">---</strong></span>
        <span>Users Online: <strong id="disp-count" style="color:#28a745;">0</strong></span>
    </div>

    <div id="main-stage">
        <div id="sidebar">
            <div id="teacher-controls">
                <div class="section-title">Drawing Tools</div>
                <div class="tool-grid">
                    <button id="tool-draw" class="tool-btn active" onclick="setTool('draw')">✏️ Pen</button>
                    <button id="tool-erase" class="tool-btn" onclick="setTool('erase')">🧹 Eraser</button>
                    <button id="tool-text" class="tool-btn" onclick="setTool('text')">🔤 Text</button>
                    <button class="tool-btn" onclick="clearBoard()">🗑️ Clear</button>
                </div>

                <div class="section-title" style="margin-top:8px;">Properties</div>
                <div class="tool-grid">
                    <input type="color" id="color-picker" value="#000000" style="width:100%; height:30px; cursor:pointer;" onchange="currentColor=this.value">
                    <input type="range" id="brush-size" min="1" max="20" value="3" style="width:100%;" oninput="currentSize=this.value">
                </div>

                <div class="section-title" style="margin-top:8px;">Chemical Shapes</div>
                <div class="tool-grid">
                    <button id="tool-benzene" class="tool-btn" onclick="setTool('benzene')">⬡ Benzene</button>
                    <button id="tool-singlebond" class="tool-btn" onclick="setTool('singlebond')">— Single Bond</button>
                    <button id="tool-doublebond" class="tool-btn" onclick="setTool('doublebond')">= Double Bond</button>
                    <button id="tool-arrow" class="tool-btn" onclick="setTool('arrow')">➔ Arrow</button>
                    <button id="tool-pill" class="tool-btn full" onclick="setTool('pill')">💊 Capsule / Pill</button>
                </div>

                <div class="section-title" style="margin-top:8px;">Room Admin</div>
                <div class="tool-grid">
                    <button id="btn-toggle-chat" class="tool-btn full" style="background:#ffc107; color:#000; font-weight:bold;" onclick="toggleChatPermission()">🔒 Disable Chat</button>
                </div>
            </div>

            <div class="section-title" style="margin-top:8px;">Participants</div>
            <ul id="participant-list"></ul>
        </div>

        <div id="canvas-container">
            <canvas id="board"></canvas>
            <div id="video-grid">
                <video id="local-video" autoplay muted playsinline></video>
            </div>
        </div>

        <div id="chat-drawer">
            <div id="chat-header">
                <span>💬 Classroom Chat</span>
                <span style="cursor:pointer;" onclick="toggleChatDrawer()">✖</span>
            </div>
            <div id="chat-messages"></div>
            <div id="chat-disabled-msg">Chat is restricted by teacher</div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChat()">
                <button class="ctrl-btn" onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <div id="controls-bar">
        <button class="ctrl-btn" id="btn-audio" onclick="toggleAudio()">🎤 Mic Off</button>
        <button class="ctrl-btn" id="btn-video" onclick="toggleVideo()">📹 Cam Off</button>
        <button class="ctrl-btn" id="btn-chat" onclick="toggleChatDrawer()">💬 Chat</button>
        <button class="ctrl-btn danger" onclick="location.reload()">🚪 Leave</button>
    </div>
</div>

<script>
    const socket = io();
    let isHost = false;
    let myStream = null;
    let currentTool = 'draw';
    let currentColor = '#000000';
    let currentSize = 3;
    let isDrawing = false;
    let startX = 0, startY = 0;
    let chatEnabled = true;
    let peerConnections = {};

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    window.addEventListener('resize', resizeCanvas);

    function resizeCanvas() {
        const container = document.getElementById('canvas-container');
        if (!container) return;
        
        // Preserve drawing on resize
        const tempImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.putImageData(tempImage, 0, 0);
    }

    function joinRoom() {
        const roomId = document.getElementById('room-code').value.trim();
        const username = document.getElementById('username').value.trim() || 'User';
        const requestedHost = document.getElementById('user-role').value === 'host';

        if (!roomId) return alert("Please enter a room code!");

        document.getElementById('lobby').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('disp-room').innerText = roomId;

        resizeCanvas();
        initMedia();

        socket.emit('join-room', { roomId, username, isHost: requestedHost });
    }

    socket.on('role-confirmed', (data) => {
        isHost = data.isHost;
        document.getElementById('teacher-controls').style.display = isHost ? 'block' : 'none';
        canvas.style.cursor = isHost ? 'crosshair' : 'default';
    });

    async function initMedia() {
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = myStream;
            
            // Start muted by default
            myStream.getAudioTracks()[0].enabled = false;
            myStream.getVideoTracks()[0].enabled = false;
        } catch (err) {
            console.warn("Media devices unaccessible or blocked:", err);
        }
    }

    function toggleAudio() {
        if (!myStream) return;
        const track = myStream.getAudioTracks()[0];
        if (!track) return;
        track.enabled = !track.enabled;
        
        const btn = document.getElementById('btn-audio');
        btn.innerText = track.enabled ? "🎤 Mic On" : "🎤 Mic Off";
        btn.classList.toggle('active', track.enabled);
        
        socket.emit('update-media-status', { isMuted: !track.enabled, isCameraOn: myStream.getVideoTracks()[0]?.enabled || false });
    }

    function toggleVideo() {
        if (!myStream) return;
        const track = myStream.getVideoTracks()[0];
        if (!track) return;
        track.enabled = !track.enabled;

        const btn = document.getElementById('btn-video');
        btn.innerText = track.enabled ? "📹 Cam On" : "📹 Cam Off";
        btn.classList.toggle('active', track.enabled);

        socket.emit('update-media-status', { isMuted: !myStream.getAudioTracks()[0]?.enabled || true, isCameraOn: track.enabled });
    }

    /* Drawing Core Engine */
    function setTool(tool) {
        if (!isHost) return;
        currentTool = tool;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(`tool-${tool}`);
        if (btn) btn.classList.add('active');
    }

    canvas.addEventListener('mousedown', (e) => {
        if (!isHost) return;
        const rect = canvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;

        if (currentTool === 'text') {
            const txt = prompt("Enter text/formula:", "");
            if (txt) {
                const stroke = { tool: 'text', text: txt, x: startX, y: startY, color: currentColor, size: currentSize * 4 + 12 };
                renderStroke(stroke);
                socket.emit('draw-stroke', stroke);
            }
            return;
        }

        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isHost || !isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (currentTool === 'draw' || currentTool === 'erase') {
            const stroke = {
                tool: currentTool,
                x1: startX, y1: startY,
                x2: x, y2: y,
                color: currentTool === 'erase' ? '#ffffff' : currentColor,
                size: currentSize
            };
            renderStroke(stroke);
            socket.emit('draw-stroke', stroke);
            startX = x;
            startY = y;
        }
    });

    canvas.addEventListener('mouseup', (e) => {
        if (!isHost || !isDrawing) return;
        isDrawing = false;
        const rect = canvas.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;

        if (currentTool !== 'draw' && currentTool !== 'erase' && currentTool !== 'text') {
            const stroke = { tool: currentTool, x1: startX, y1: startY, x2: endX, y2: endY, color: currentColor, size: currentSize };
            renderStroke(stroke);
            socket.emit('draw-stroke', stroke);
        }
    });

    function renderStroke(data) {
        ctx.lineWidth = data.size;
        ctx.strokeStyle = data.color;
        ctx.fillStyle = data.color;
        ctx.lineCap = 'round';

        if (data.tool === 'text') {
            ctx.font = `${data.size}px sans-serif`;
            ctx.fillText(data.text, data.x, data.y);
            return;
        }

        ctx.beginPath();
        if (data.tool === 'draw' || data.tool === 'erase') {
            ctx.moveTo(data.x1, data.y1);
            ctx.lineTo(data.x2, data.y2);
            ctx.stroke();
        } else if (data.tool === 'singlebond') {
            ctx.moveTo(data.x1, data.y1); ctx.lineTo(data.x2, data.y2); ctx.stroke();
        } else if (data.tool === 'doublebond') {
            const dx = data.x2 - data.x1, dy = data.y2 - data.y1;
            const angle = Math.atan2(dy, dx);
            const px = Math.sin(angle) * 3, py = -Math.cos(angle) * 3;
            ctx.moveTo(data.x1 + px, data.y1 + py); ctx.lineTo(data.x2 + px, data.y2 + py);
            ctx.moveTo(data.x1 - px, data.y1 - py); ctx.lineTo(data.x2 - px, data.y2 - py); ctx.stroke();
        } else if (data.tool === 'arrow') {
            const dx = data.x2 - data.x1, dy = data.y2 - data.y1;
            const angle = Math.atan2(dy, dx);
            ctx.moveTo(data.x1, data.y1); ctx.lineTo(data.x2, data.y2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(data.x2, data.y2);
            ctx.lineTo(data.x2 - 10 * Math.cos(angle - Math.PI / 6), data.y2 - 10 * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(data.x2 - 10 * Math.cos(angle + Math.PI / 6), data.y2 - 10 * Math.sin(angle + Math.PI / 6));
            ctx.closePath(); ctx.fill();
        } else if (data.tool === 'benzene') {
            const radius = Math.hypot(data.x2 - data.x1, data.y2 - data.y1);
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 3) * i;
                const px = data.x1 + radius * Math.cos(a);
                const py = data.y1 + radius * Math.sin(a);
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath(); ctx.stroke();
            ctx.beginPath(); ctx.arc(data.x1, data.y1, radius * 0.55, 0, Math.PI * 2); ctx.stroke();
        } else if (data.tool === 'pill') {
            ctx.arc(data.x1 - 10, data.y1, 10, Math.PI / 2, -Math.PI / 2);
            ctx.arc(data.x1 + 10, data.y1, 10, -Math.PI / 2, Math.PI / 2);
            ctx.closePath(); ctx.stroke();
        }
    }

    function clearBoard() {
        if (!isHost) return;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        socket.emit('clear-canvas');
    }

    socket.on('draw-stroke', renderStroke);
    socket.on('load-canvas-history', (history) => history.forEach(renderStroke));
    socket.on('clear-canvas', () => {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    });

    /* Chat System */
    function toggleChatDrawer() {
        const drawer = document.getElementById('chat-drawer');
        const isVisible = drawer.style.display === 'flex';
        drawer.style.display = isVisible ? 'none' : 'flex';
    }

    function sendChat() {
        const input = document.getElementById('chat-input');
        const txt = input.value.trim();
        if (!txt) return;
        socket.emit('send-chat-message', txt);
        input.value = '';
    }

    function toggleChatPermission() {
        if (!isHost) return;
        chatEnabled = !chatEnabled;
        socket.emit('toggle-chat-status', chatEnabled);
        updateChatUI();
    }

    function updateChatUI() {
        const inputArea = document.getElementById('chat-input-area');
        const banner = document.getElementById('chat-disabled-msg');
        const btn = document.getElementById('btn-toggle-chat');

        if (btn) {
            btn.innerText = chatEnabled ? "🔒 Disable Chat" : "🔓 Enable Chat";
            btn.style.background = chatEnabled ? "#ffc107" : "#28a745";
        }

        if (!chatEnabled && !isHost) {
            inputArea.style.display = 'none';
            banner.style.display = 'block';
        } else {
            inputArea.style.display = 'flex';
            banner.style.display = 'none';
        }
    }

    socket.on('new-chat-message', (msg) => {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<div class="msg-sender">${msg.sender} ${msg.isHost ? '(Teacher)' : ''} • ${msg.time}</div><div>${msg.text}</div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    });

    socket.on('load-chat-history', (data) => {
        chatEnabled = data.enabled;
        document.getElementById('chat-messages').innerHTML = '';
        data.history.forEach(msg => {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<div class="msg-sender">${msg.sender} ${msg.isHost ? '(Teacher)' : ''} • ${msg.time}</div><div>${msg.text}</div>`;
            box.appendChild(div);
        });
        updateChatUI();
    });

    socket.on('chat-status-changed', (enabled) => {
        chatEnabled = enabled;
        updateChatUI();
    });

    /* Participant Updates */
    socket.on('update-participants', (users) => {
        document.getElementById('disp-count').innerText = users.length;
        const list = document.getElementById('participant-list');
        list.innerHTML = '';

        users.forEach(u => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="user-meta">
                    <strong>${u.username}</strong>
                    <span class="role-tag ${u.isHost ? 'role-teacher' : 'role-student'}">${u.isHost ? 'Teacher' : 'Student'}</span>
                </div>
                <div class="user-status">
                    <span>${u.isMuted ? '🔇 Muted' : '🎤 Mic On'}</span>
                    <span>${u.isCameraOn ? '📹 Cam On' : '📷 Cam Off'}</span>
                </div>
            `;
            list.appendChild(li);
        });
    });
</script>
</body>
</html>
